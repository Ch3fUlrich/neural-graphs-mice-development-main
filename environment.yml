name: ngmd
channels:
  - conda-forge
dependencies:
  - python >=3.10,<3.11
  - nomkl
  - libblas=*=*openblas
  - matplotlib
  - pyyaml
  - networkx
  - pandas
  - pip
  - joblib
  - scipy
  - scikit-learn>=1.1
  - statsmodels>=0.13
  - plotly>=5.11
  - pot>=0.8
  - pytest
  - tqdm
  - click>=8.1.3
  - ipykernel
  - ipympl>=0.9
  - jupyterlab>=3.2
  - jupyter-dash>=0.4
  - xlsxwriter>=3.0
  - pip:
    - torch
    - NetLSD>=1.0
    - .
